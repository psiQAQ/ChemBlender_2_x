schema_version = "1.0.0"
id = "chemblender"
version = "2.5.0"
name = "ChemBlender"
tagline = "Scientific results, structures and fields for Blender"
maintainer = "LiHaodong"
type = "add-on"
website = "https://www.chemblender.com"
blender_version_min = "5.1.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64"]

[permissions]
files = "Read CBQ data, save project files, and run a local processor"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.zip",
  "scripts/",
  "tests/",
]
