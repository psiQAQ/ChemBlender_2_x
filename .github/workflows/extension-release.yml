name: extension-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (for example v2.3.0)
        required: true
        type: string
      publish:
        description: Publish after verification
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: extension-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.release_info.outputs.run_id }}
      tag_commit: ${{ steps.release_info.outputs.tag_commit }}
      version: ${{ steps.release_info.outputs.version }}
      artifact_name: ${{ steps.release_info.outputs.artifact_name }}
      package_name: ${{ steps.release_info.outputs.package_name }}
      checksum_name: ${{ steps.release_info.outputs.checksum_name }}
      channel: ${{ steps.release_info.outputs.channel }}
      is_prerelease: ${{ steps.release_info.outputs.is_prerelease }}
    steps:
      - name: Require default-branch workflow ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="refs/heads/$DEFAULT_BRANCH"
          if [[ "$WORKFLOW_REF" != "$expected" ]]; then
            echo "Release workflow must be dispatched from $expected, got $WORKFLOW_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          path: tag-source
      - name: Resolve exact tag package run
        id: release_info
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$(git -C tag-source cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release ref must be an annotated tag: $RELEASE_TAG" >&2
            exit 1
          fi

          git -C tag-source fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git -C tag-source rev-list -n 1 "$RELEASE_TAG")"
          git -C tag-source merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Tag commit is not in origin/main: $tag_commit" >&2
            exit 1
          }

          metadata_json="$(
            python3 ChemBlender/scripts/release_metadata.py \
              --extension-root tag-source/ChemBlender --format json --include-channel
          )"
          version="$(jq -r '.version' <<< "$metadata_json")"
          artifact_name="$(jq -r '.artifact_name' <<< "$metadata_json")"
          package_name="$(jq -r '.package_name' <<< "$metadata_json")"
          checksum_name="$(jq -r '.checksum_name' <<< "$metadata_json")"
          channel="$(jq -r '.channel' <<< "$metadata_json")"
          is_prerelease="$(jq -r '.is_prerelease' <<< "$metadata_json")"
          expected_tag="v$version"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match metadata $expected_tag" >&2
            exit 1
          fi

          mapfile -t run_ids < <(
            gh run list --repo "$GH_REPO" --workflow extension-package.yml \
              --event push --branch "$RELEASE_TAG" --commit "$tag_commit" \
              --status success --limit 10 \
              --json databaseId,headSha,headBranch,event,conclusion \
              --jq ".[] | select(.headSha == \"$tag_commit\" and .headBranch == \"$RELEASE_TAG\" and .event == \"push\" and .conclusion == \"success\") | .databaseId"
          )
          if [[ "${#run_ids[@]}" -ne 1 ]]; then
            echo "Expected one successful exact-tag package run, found ${#run_ids[@]}" >&2
            exit 1
          fi
          run_id="${run_ids[0]}"
          mapfile -t artifact_ids < <(
            gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" |
              jq -r --arg name "$artifact_name" \
                '.artifacts[] | select(.name == $name and .expired == false) | .id'
          )
          if [[ "${#artifact_ids[@]}" -ne 1 ]]; then
            echo "Expected one unexpired artifact named $artifact_name, found ${#artifact_ids[@]}" >&2
            exit 1
          fi

          {
            echo "run_id=$run_id"
            echo "tag_commit=$tag_commit"
            echo "version=$version"
            echo "artifact_name=$artifact_name"
            echo "package_name=$package_name"
            echo "checksum_name=$checksum_name"
            echo "channel=$channel"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Download and verify tag artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ steps.release_info.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.release_info.outputs.artifact_name }}
          PACKAGE_NAME: ${{ steps.release_info.outputs.package_name }}
          CHECKSUM_NAME: ${{ steps.release_info.outputs.checksum_name }}
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "$ARTIFACT_NAME" --dir dist
          mkdir release-assets
          cp -- "dist/$PACKAGE_NAME" "dist/$CHECKSUM_NAME" release-assets/
          python3 ChemBlender/scripts/verify_release_artifact.py \
            --artifact-dir release-assets --extension-root tag-source/ChemBlender --tag "$RELEASE_TAG" \
            --metadata-mode release-assets \
            --budget tag-source/.github/artifact-budgets.json
          python3 ChemBlender/scripts/extract_release_notes.py \
            --changelog CHANGELOG.md --version "$VERSION" --output release-notes.md
          if [[ -f tag-source/CHANGELOG.md ]]; then
            python3 ChemBlender/scripts/extract_release_notes.py \
              --changelog tag-source/CHANGELOG.md --version "$VERSION" --output tag-release-notes.md
            cmp release-notes.md tag-release-notes.md
          fi

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag_commit }}
          path: tag-source
      - name: Download and reverify tag artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ needs.verify.outputs.run_id }}
          ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          CHECKSUM_NAME: ${{ needs.verify.outputs.checksum_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "$ARTIFACT_NAME" --dir dist
          mkdir release-assets
          cp -- "dist/$PACKAGE_NAME" "dist/$CHECKSUM_NAME" release-assets/
          python3 ChemBlender/scripts/verify_release_artifact.py \
            --artifact-dir release-assets --extension-root tag-source/ChemBlender --tag "$RELEASE_TAG" \
            --metadata-mode release-assets \
            --budget tag-source/.github/artifact-budgets.json
          python3 ChemBlender/scripts/extract_release_notes.py \
            --changelog CHANGELOG.md --version "$VERSION" --output release-notes.md
          if [[ -f tag-source/CHANGELOG.md ]]; then
            python3 ChemBlender/scripts/extract_release_notes.py \
              --changelog tag-source/CHANGELOG.md --version "$VERSION" --output tag-release-notes.md
            cmp release-notes.md tag-release-notes.md
          fi
      - name: Create verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          CHECKSUM_NAME: ${{ needs.verify.outputs.checksum_name }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
          VERIFIED_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          package="dist/$PACKAGE_NAME"
          checksum="dist/$CHECKSUM_NAME"
          package_digest="sha256:$(sha256sum "$package" | cut -d ' ' -f 1)"
          checksum_digest="sha256:$(sha256sum "$checksum" | cut -d ' ' -f 1)"

          release_flags=(--draft)
          case "$IS_PRERELEASE" in
            true) release_flags+=(--prerelease) ;;
            false) ;;
            *)
              echo "Invalid prerelease metadata: $IS_PRERELEASE" >&2
              exit 1
              ;;
          esac

          git -C tag-source fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git -C tag-source cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Remote release ref must remain an annotated tag: $RELEASE_TAG" >&2
            exit 1
          fi
          current_tag_commit="$(git -C tag-source rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [[ "$current_tag_commit" != "$VERIFIED_TAG_COMMIT" ]]; then
            echo "Release tag moved after verification: $current_tag_commit != $VERIFIED_TAG_COMMIT" >&2
            exit 1
          fi

          echo "Creating $CHANNEL channel release for $VERSION"
          gh release create "$RELEASE_TAG" "$package" "$checksum" \
            --repo "$GH_REPO" --verify-tag "${release_flags[@]}" \
            --notes-file release-notes.md \
            --title "ChemBlender $VERSION"

          release_json="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,assets)"
          [[ "$(jq -r '.isDraft' <<< "$release_json")" == "true" ]]
          [[ "$(jq -r '.isPrerelease' <<< "$release_json")" == "$IS_PRERELEASE" ]]
          [[ "$(jq '.assets | length' <<< "$release_json")" -eq 2 ]]
          [[ "$(jq -r --arg name "$PACKAGE_NAME" '.assets[] | select(.name == $name) | .digest' <<< "$release_json")" == "$package_digest" ]]
          [[ "$(jq -r --arg name "$CHECKSUM_NAME" '.assets[] | select(.name == $name) | .digest' <<< "$release_json")" == "$checksum_digest" ]]

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" \
              --draft=false --prerelease --verify-tag
            published_json="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,isPrerelease)"
            [[ "$(jq -r '.isDraft' <<< "$published_json")" == "false" ]]
            [[ "$(jq -r '.isPrerelease' <<< "$published_json")" == "true" ]]
            [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" != "$RELEASE_TAG" ]]
          else
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" \
              --draft=false --latest --verify-tag
            published_json="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,isPrerelease)"
            [[ "$(jq -r '.isDraft' <<< "$published_json")" == "false" ]]
            [[ "$(jq -r '.isPrerelease' <<< "$published_json")" == "false" ]]
            [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" == "$RELEASE_TAG" ]]
          fi
